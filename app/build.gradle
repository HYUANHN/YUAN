plugins {
    id 'com.android.application'
}

// 可选 release 签名：配置 KEYSTORE_FILE / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
// （可用环境变量，或用 gradle.properties 的 keystoreFile 等属性，或写进 local.properties）。
// 未配置时不启用签名，构建仍可成功（release 包为未签名/debug签名）。
def keystoreFile = System.getenv('KEYSTORE_FILE') ?: findProperty('keystoreFile')
def keystorePassword = System.getenv('KEYSTORE_PASSWORD') ?: findProperty('keystorePassword')
def keyAlias = System.getenv('KEY_ALIAS') ?: findProperty('keyAlias')
def keyPassword = System.getenv('KEY_PASSWORD') ?: findProperty('keyPassword')
boolean hasReleaseSigning = keystoreFile && file(keystoreFile).exists()

android {
    namespace 'com.videobox.movie'
    compileSdk 34

    defaultConfig {
        applicationId "com.videobox.movie"
        minSdk 21
        targetSdk 34
        versionCode 58
        versionName "2.0.3"
        multiDexEnabled true
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystoreFile)
                storePassword keystorePassword
                keyAlias keyAlias
                keyPassword keyPassword
            }
        }
    }

    buildTypes {
        // debug 也开启 R8 去冗余，把方法数压到 65536 内，合并为单个 dex
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lintOptions {
        abortOnError false
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.4.1'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
